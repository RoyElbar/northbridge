<svg viewBox="0 0 880 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <rect width="880" height="400" fill="#0d1117"/>
  <text x="440" y="66" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="4" fill="#a1a1a6">COORDINATION</text>
  <text x="440" y="116" text-anchor="middle" font-size="38" font-weight="600" letter-spacing="-0.5" fill="#f5f5f7">Many agents. One mind.</text>
  <text x="440" y="152" text-anchor="middle" font-size="17" fill="#a1a1a6">Claim before writing. Share every lesson. One source of truth.</text>

  <!-- three agents converge to one bus, one memory -->
  <g fill="#5f9bd6">
    <circle cx="250" cy="230" r="9"/>
    <circle cx="250" cy="290" r="9"/>
    <circle cx="250" cy="350" r="9"/>
  </g>
  <g stroke="#2f3237" stroke-width="1.5" fill="none">
    <path d="M 262 230 C 330 230 350 285 420 288"/>
    <path d="M 262 290 H 420"/>
    <path d="M 262 350 C 330 350 350 295 420 292"/>
  </g>
  <rect x="424" y="240" width="4" height="100" rx="2" fill="#f5f5f7"/>
  <line x1="430" y1="290" x2="540" y2="290" stroke="#2f3237" stroke-width="1.5"/>
  <rect x="544" y="262" width="130" height="56" rx="12" fill="#5f9bd6"/>
  <text x="609" y="296" text-anchor="middle" font-size="15" font-weight="600" fill="#0d1117">one memory</text>

  <circle r="4" fill="#5f9bd6" opacity="0">
    <animateMotion dur="2.8s" repeatCount="indefinite" begin="0.5s" path="M 434 290 H 540"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="2.8s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
</svg>
