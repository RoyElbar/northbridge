<svg viewBox="0 0 880 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="440" y="66" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="4" fill="#6e6e73">VERIFICATION</text>
  <text x="440" y="116" text-anchor="middle" font-size="38" font-weight="600" letter-spacing="-0.5" fill="#1d1d1f">Nothing ships unchecked.</text>
  <text x="440" y="152" text-anchor="middle" font-size="17" fill="#6e6e73">Every result is re-derived and source-checked before it counts.</text>

  <!-- flow: result -> verify -> committed / blocked -->
  <g font-size="15">
    <text x="235" y="296" text-anchor="end" font-weight="600" fill="#1d1d1f">result</text>
    <line x1="252" y1="290" x2="352" y2="290" stroke="#d2d2d7" stroke-width="1.5"/>

    <rect x="356" y="258" width="140" height="64" rx="14" fill="none" stroke="#3a6ea5" stroke-width="2"/>
    <text x="426" y="296" text-anchor="middle" font-weight="600" fill="#3a6ea5">verify</text>

    <line x1="500" y1="276" x2="596" y2="252" stroke="#d2d2d7" stroke-width="1.5"/>
    <line x1="500" y1="304" x2="596" y2="328" stroke="#d2d2d7" stroke-width="1.5"/>
    <text x="612" y="258" font-weight="600" fill="#1d1d1f">committed</text>
    <text x="612" y="334" font-weight="600" fill="#6e6e73" opacity="0.55">blocked</text>
  </g>

  <circle r="4" fill="#3a6ea5" opacity="0">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M 256 290 H 350"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.25;0.75;1" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#3a6ea5" opacity="0">
    <animateMotion dur="3.2s" repeatCount="indefinite" begin="1.4s" path="M 502 276 L 594 252"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.25;0.75;1" dur="3.2s" repeatCount="indefinite" begin="1.4s"/>
  </circle>
</svg>
